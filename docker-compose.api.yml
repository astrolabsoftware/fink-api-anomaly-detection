services:

  api.ztf.fink-portal.log-anomaly-detection:
    image: gitlab-registry.in2p3.fr/astrolabsoftware/fink/api.fink-portal.log-anomaly-detection-api:latest
    pull_policy: always
    restart: unless-stopped  
    env_file:
      - .env.ztf
    ports:
      - "8000:8000"

