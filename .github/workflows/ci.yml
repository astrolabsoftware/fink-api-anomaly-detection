
name: Build and Push docker image to GitLab Registry

on:
  # Build and publish the image when its sources change on main on pathes 
  # src/**, artifacts/**, Dockerfile.api, .dockerignore, .env.example, requirements.api.txt, and .github/workflows/ci.yml
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile.api'
      - '.dockerignore'
      - '.env.*.example'
      - 'src/**'
      - 'artifacts/**'
      - 'requirements.api.txt'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build --pull --no-cache \
            -t gitlab-registry.in2p3.fr/astrolabsoftware/fink/api.fink-portal.log-anomaly-detection-api:${{ github.sha }} \
            -t gitlab-registry.in2p3.fr/astrolabsoftware/fink/api.fink-portal.log-anomaly-detection-api:latest \
            -f Dockerfile.api .

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.1
          image-ref: gitlab-registry.in2p3.fr/astrolabsoftware/fink/api.fink-portal.log-anomaly-detection-api:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          
      - name: Log in to Fink GitLab Container Registry
        env:
          GITLAB_REGISTRY_USER: ${{ secrets.GITLAB_REGISTRY_USER }}
          GITLAB_REGISTRY_TOKEN: ${{ secrets.GITLAB_REGISTRY_TOKEN }}
        run: |
          echo "$GITLAB_REGISTRY_TOKEN" | docker login gitlab-registry.in2p3.fr \
            -u "$GITLAB_REGISTRY_USER" \
            --password-stdin

      - name: Push Docker image to GitLab Registry
        run: |
          docker push gitlab-registry.in2p3.fr/astrolabsoftware/fink/api.fink-portal.log-anomaly-detection-api:${{ github.sha }}
          docker push gitlab-registry.in2p3.fr/astrolabsoftware/fink/api.fink-portal.log-anomaly-detection-api:latest