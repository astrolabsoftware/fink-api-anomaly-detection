
name: Build and Push Anomaly Detection API image to DockerHub

on:
  # Build and publish the image when its sources change on main on pathes 
  # src/**, artifacts/**, Dockerfile.api, .dockerignore, .env.example, requirements.api.txt, and .github/workflows/ci.yml
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile.api'
      - '.dockerignore'
      - '.env.example'
      - 'src/**'
      - 'artifacts/**'
      - 'requirements.api.txt'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build --pull --no-cache \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/ztf.api.fink-portal.log-anomaly-detection:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/ztf.api.fink-portal.log-anomaly-detection:latest \
            -f Dockerfile.api .

      - name: Verify installed Python package versions
        run: |
          docker run --rm --entrypoint python \
            ${{ secrets.DOCKERHUB_USERNAME }}/ztf.api.fink-portal.log-anomaly-detection:${{ github.sha }} \
            -c "from importlib.metadata import version; from packaging.version import Version; expected = {'msgpack': '1.2.3', 'setuptools': '78.1.1', 'urllib3': '2.8.0'}; actual = {name: version(name) for name in expected}; print(actual); assert all(Version(actual[name]) >= Version(minimum) for name, minimum in expected.items()), actual"

      - name: List bundled Python wheel SBOMs
        run: |
          docker run --rm --entrypoint sh \
            ${{ secrets.DOCKERHUB_USERNAME }}/ztf.api.fink-portal.log-anomaly-detection:${{ github.sha }} \
            -c "find /venv -type f -path '*/.dist-info/sboms/*' -print"

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.1
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/ztf.api.fink-portal.log-anomaly-detection:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          skip-files: '**/*.dist-info/sboms/*.cdx,**/*.dist-info/sboms/*.cdx.json,**/*.dist-info/sboms/*.spdx,**/*.dist-info/sboms/*.spdx.json'

      - name: Log in to DockerHub Container Registry
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Push Docker image to DockerHub
        run: |
          docker push docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ztf.api.fink-portal.log-anomaly-detection:${{ github.sha }}
          docker push docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ztf.api.fink-portal.log-anomaly-detection:latest